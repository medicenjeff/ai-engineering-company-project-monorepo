[project]
name = "nexova-incidents"
version = "0.1.0"
description = "Shared CSV validation for Nexova incident imports and API analysis"
requires-python = ">=3.14"
dependencies = ["pandas>=2.2.0", "pydantic[email]>=2.13.5"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"